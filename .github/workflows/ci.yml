name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/cache/restore@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      # Save even if typecheck fails, so the next run is not a cold install.
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm run routes:generate
      - run: npm run typecheck
      # Scripts, auth and app-data unit tests, plus test:domain and test:ui once they exist.
      - run: npm test
      # This job has no DATABASE_URL, so the build's db:migrate step must skip cleanly.
      - run: npm run build
      - run: npm run lint
